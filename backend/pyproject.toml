[project]
name = "rangmanch-backend"
version = "0.1.0"
description = "Cultural screenplay adaptation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "pymupdf>=1.23.0",
    "anthropic>=0.18.0",
    "openai>=1.14.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "services", "cultural_ref"]

